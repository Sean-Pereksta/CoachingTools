name: Fix Coordinator Range Builder Mount

on:
  push:
    branches:
      - fix/coordinator-range-builder-mount

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coordinator-range-builder-mount
          fetch-depth: 0

      - name: Patch reliable Coach Timeline range loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('CoachTools/shared/coachtools-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          anchor = "  function loadSharedScript(name, readyCheck) {"
          call_anchor = "  installChunkedStartupLoader();\n  installDockChunkLoaderScript();"
          marker = "function installCoachTimelineCoordinatorRangeScript()"

          if marker not in shell:
              if shell.count(anchor) != 1:
                  raise SystemExit(f'Expected one loader anchor, found {shell.count(anchor)}')
              loader = '''  function installCoachTimelineCoordinatorRangeScript() {\n    if (!sharedBase || app.id !== 'coach-timeline' || document.getElementById('coach-timeline-coordinator-ranges-script')) return;\n    const src = new URL('coach-timeline-coordinator-ranges.js', sharedBase).href;\n    if (document.readyState === 'loading') {\n      const safeSrc = src.replace(/&/g, '&amp;').replace(/\"/g, '&quot;');\n      document.write(`<script id=\"coach-timeline-coordinator-ranges-script\" src=\"${safeSrc}\"><\\/script>`);\n      return;\n    }\n    const script = document.createElement('script');\n    script.id = 'coach-timeline-coordinator-ranges-script';\n    script.src = src;\n    script.async = false;\n    document.head.appendChild(script);\n  }\n\n'''
              shell = shell.replace(anchor, loader + anchor)
          if "installCoachTimelineCoordinatorRangeScript();" not in shell:
              if shell.count(call_anchor) != 1:
                  raise SystemExit(f'Expected one call anchor, found {shell.count(call_anchor)}')
              shell = shell.replace(call_anchor, call_anchor + "\n  installCoachTimelineCoordinatorRangeScript();")
          shell_path.write_text(shell, encoding='utf-8')

          range_path = Path('CoachTools/shared/coach-timeline-coordinator-ranges.js')
          range_text = range_path.read_text(encoding='utf-8')
          old = "    attempts += 1;\n    if (attempts < 120) root.setTimeout(tryInstall, 50);"
          new = "    attempts += 1;\n    if (attempts < 1200) root.setTimeout(tryInstall, 250);"
          if old in range_text:
              range_text = range_text.replace(old, new)
          elif new not in range_text:
              raise SystemExit('Could not find Coordinator range retry block.')
          range_path.write_text(range_text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check CoachTools/shared/coachtools-shell.js
          node --check CoachTools/shared/coach-timeline-coordinator-ranges.js

      - name: Commit mount fix
        shell: bash
        run: |
          git config user.name "CoachTools Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-coordinator-range-builder-mount.yml
          git add CoachTools/shared/coachtools-shell.js CoachTools/shared/coach-timeline-coordinator-ranges.js
          git commit -m "Fix Coordinator custom range builder mount"
          git push origin HEAD:fix/coordinator-range-builder-mount

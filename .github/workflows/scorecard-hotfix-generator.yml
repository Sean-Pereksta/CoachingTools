name: Scorecard Hotfix Generator

on:
  push:
    branches:
      - hotfix/scorecard-file-launch
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'hotfix/scorecard-file-launch' || github.ref_name == 'hotfix/scorecard-file-launch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/scorecard-file-launch
          fetch-depth: 0

      - name: Generate self-contained scorecard
        run: node CoachTools/build/build-performance-scorecard-enhanced.js

      - name: Verify ranking and file-launch contracts
        working-directory: CoachTools
        run: node tests/performance-scorecard-ranking.test.js

      - name: Commit generated scorecard
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated scorecard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/apps/performance-scorecard-enhanced.html CoachTools/build/performance-scorecard-ranking-patch.txt
          git commit -m "Generate file-safe enhanced scorecard"
          git push origin HEAD:hotfix/scorecard-file-launch

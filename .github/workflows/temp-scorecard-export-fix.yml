name: Temporary Scorecard Export Compatibility Fix

on:
  push:
    branches:
      - feature/performance-scorecard-display-export-themes-20260826

permissions:
  contents: write

jobs:
  patch-scorecard-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch export compatibility
        run: python .github/temp_patch_scorecard_export.py
      - name: Regenerate enhanced scorecard
        run: node CoachTools/build/build-performance-scorecard-enhanced.js
      - name: Run scorecard contracts
        run: node CoachTools/tests/performance-scorecard-ranking.test.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/build/build-performance-scorecard-enhanced.js CoachTools/build/performance-scorecard-ranking-patch.txt CoachTools/apps/performance-scorecard-enhanced.html CoachTools/tests/performance-scorecard-ranking.test.js
          if git diff --cached --quiet; then
            echo "No export compatibility changes needed."
            exit 0
          fi
          git commit -m "Fix Performance Scorecard export CSS compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}

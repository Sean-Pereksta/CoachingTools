name: Scorecard export pre-clone fix

on:
  push:
    branches:
      - fix/performance-scorecard-export-preclone-20260826

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-scorecard-export-preclone-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch export lifecycle
        run: node CoachTools/build/patch-performance-scorecard-export-preclone.js
      - name: Regenerate enhanced scorecard
        run: node CoachTools/build/build-performance-scorecard-enhanced.js
      - name: Verify scorecard contracts
        run: node CoachTools/tests/performance-scorecard-ranking.test.js
      - name: Commit generated fix
        shell: bash
        run: |
          rm -f CoachTools/build/patch-performance-scorecard-export-preclone.js
          rm -f .github/workflows/scorecard-export-preclone-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/build/performance-scorecard-ranking-patch.txt CoachTools/apps/performance-scorecard-enhanced.html CoachTools/tests/performance-scorecard-ranking.test.js CoachTools/build/patch-performance-scorecard-export-preclone.js .github/workflows/scorecard-export-preclone-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Scorecard export before html2canvas cloning [skip ci]"
          git push origin HEAD:fix/performance-scorecard-export-preclone-20260826

name: Finalize tested Qualtrics percentage patch
on:
  push:
    branches: [agent/qualtrics-value-percent-formats]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply the reviewed source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/qualtrics-value-percent-build.yml').read_text()
          begin="          python3 - <<'PY'\n"
          patch=workflow.split(begin,1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(patch),'qualtrics-source-patch','exec'))
          PY
      - name: Install locked dependencies
        working-directory: CoachTools
        run: npm ci --ignore-scripts
      - name: Run every All-Star regression and rebuild portable
        working-directory: CoachTools
        run: npm run test:allstar
      - name: Verify repository-wide validation errors against unchanged main
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/qualtrics-baseline" origin/main
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, re
          changed=Path('CoachTools').resolve()
          baseline=Path(os.environ['RUNNER_TEMP'])/'qualtrics-baseline'/'CoachTools'
          for script,args in [('build/generate-app-manifest.js',['--check']),('build/validate-suite.js',[])]:
              results=[]
              for label,root in [('main',baseline),('feature',changed)]:
                  run=subprocess.run(['node',script,*args],cwd=root,text=True,capture_output=True)
                  output=run.stdout+run.stderr
                  print(f'=== {label}: {script}; exit={run.returncode} ===\n{output}',flush=True)
                  normalized=output.replace(str(root),'<SUITE>').replace(str(baseline.parent),'<REPO>').replace(str(changed.parent),'<REPO>')
                  errors=sorted(line.strip() for line in normalized.splitlines() if line.startswith('ERROR:') or line.startswith('- Duplicate application id'))
                  results.append((run.returncode,errors))
              if results[0]!=results[1]:
                  raise RuntimeError(f'{script}: feature validation differs from main; stop before committing')
              print(f'PASS baseline parity: {script}; no new repository-wide validation errors')
          PY
      - name: Record the top-level test result
        working-directory: CoachTools
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/qualtrics-npm-test.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/qualtrics-npm-test.log"
          echo "npm test exit: $result (baseline validation parity verified in the preceding step)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            grep -q 'Duplicate application id kpi-impact' "$RUNNER_TEMP/qualtrics-npm-test.log"
          fi
      - name: Commit only the focused source and generated outputs
        shell: bash
        run: |
          git diff --check
          git add CoachTools/apps/allstar/qualtrics/individual-messages.js CoachTools/apps/allstar/qualtrics/generator.html CoachTools/apps/allstar/qualtrics/generator-source.js CoachTools/apps/allstar/dist/All-Star-Portable.html CoachTools/package.json CoachTools/docs/qualtrics-value-percentage-tokens.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Support explicit percentage formats for Qualtrics rule message values'
            git push origin HEAD:refs/heads/agent/qualtrics-value-percent-formats
          fi
          git log -1 --oneline

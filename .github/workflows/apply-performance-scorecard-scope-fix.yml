name: Apply Performance Scorecard Scope Fix

on:
  push:
    branches:
      - fix/performance-scorecard-scope
    paths:
      - .github/workflows/apply-performance-scorecard-scope-fix.yml
      - tools/patch-performance-scorecard-scope.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-scorecard-scope

      - name: Patch scorecard
        run: python tools/patch-performance-scorecard-scope.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('CoachTools/apps/performance-scorecard.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/performance-scorecard-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/performance-scorecard-inline.js

      - name: Commit patched scorecard
        shell: bash
        run: |
          rm .github/workflows/apply-performance-scorecard-scope-fix.yml tools/patch-performance-scorecard-scope.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/apps/performance-scorecard.html .github/workflows/apply-performance-scorecard-scope-fix.yml tools/patch-performance-scorecard-scope.py
          git commit -m "Fix Performance Scorecard coach and team scope"
          git push origin HEAD:fix/performance-scorecard-scope

name: Scorecard Fast Build

on:
  push:
    branches:
      - fix/scorecard-load-performance

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate optimized scorecard
        working-directory: CoachTools
        run: node build/build-performance-scorecard-enhanced.js
      - name: Verify scorecard contracts
        working-directory: CoachTools
        run: node tests/performance-scorecard-ranking.test.js
      - name: Commit generated scorecard
        shell: bash
        run: |
          if git diff --quiet -- CoachTools/apps/performance-scorecard-enhanced.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/apps/performance-scorecard-enhanced.html
          git commit -m "Generate optimized Performance Scorecard"
          git push

name: Apply Coordinator Range Bridge

'on':
  push:
    branches:
      - feature/coordinator-speed-custom-range-columns

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coordinator-speed-custom-range-columns
          fetch-depth: 0

      - name: Patch Coach Timeline
        run: python CoachTools/build/apply-coordinator-range-bridge.py

      - name: Check JavaScript syntax
        run: |
          node --check CoachTools/shared/coach-timeline-coordinator-ranges.js
          node --check CoachTools/shared/coachtools-insight-ui.js
          node --check /tmp/coach-timeline-inline.js

      - name: Commit bridge
        run: |
          git config user.name "CoachTools Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-coordinator-range-bridge.yml
          git rm CoachTools/build/apply-coordinator-range-bridge.py
          git add CoachTools/apps/coach-timeline.html
          git commit -m "Expose coordinator range column bridge"
          git push origin HEAD:feature/coordinator-speed-custom-range-columns

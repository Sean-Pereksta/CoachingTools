name: Apply and verify Weekly Builder update
on:
  push:
    branches: [chatgpt/weekly-builder-manager-settings-20260929]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/weekly-builder-manager-settings-20260929
      - name: Apply focused update and run regression tests
        run: |
          python .github/apply-weekly-update.py
          test -s CoachTools/apps/weekly-data-builder.html
          node --test tests/weekly-data-builder-manager-settings.test.cjs
          git add CoachTools/apps/weekly-data-builder.html CoachTools/shared/coachtools-import.js
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Weekly Builder hierarchy and saved name rules; pass regression tests'
          git push origin HEAD:chatgpt/weekly-builder-manager-settings-20260929

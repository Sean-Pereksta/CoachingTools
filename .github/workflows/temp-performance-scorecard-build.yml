name: Temporary Performance Scorecard Build

on:
  push:
    branches:
      - feature/performance-scorecard-display-export-themes-20260826

permissions:
  contents: write

jobs:
  build-scorecard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            CoachTools/apps/performance-scorecard.html
            CoachTools/apps/performance-scorecard-enhanced.html
            CoachTools/apps.json
            CoachTools/build/build-performance-scorecard-enhanced.js
            CoachTools/build/performance-scorecard-ranking-patch.txt
            CoachTools/build/generate-app-manifest.js
            CoachTools/tests/performance-scorecard-ranking.test.js
            CoachTools/shared/performance-scorecard-extras.css
      - name: Regenerate enhanced scorecard
        run: node CoachTools/build/build-performance-scorecard-enhanced.js
      - name: Run scorecard contracts
        run: node CoachTools/tests/performance-scorecard-ranking.test.js
      - name: Commit generated scorecard
        shell: bash
        run: |
          if git diff --quiet -- CoachTools/apps/performance-scorecard-enhanced.html; then
            echo "Enhanced scorecard already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoachTools/apps/performance-scorecard-enhanced.html
          git commit -m "Regenerate Performance Scorecard enhanced app"
          git push origin HEAD:${GITHUB_REF_NAME}

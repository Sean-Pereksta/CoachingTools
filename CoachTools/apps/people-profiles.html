<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>People Profiles</title>
  <meta name="coachtools-id" content="people-profiles">
  <meta name="coachtools-name" content="People Profiles">
  <meta name="coachtools-description" content="Find a coach or representative and review department-relative performance, rankings, coaching, checklist, QA, and timeline details.">
  <meta name="coachtools-category" content="People">
  <meta name="coachtools-icon" content="icons/default-app.png">
  <meta name="coachtools-initials" content="PP">
  <meta name="coachtools-keywords" content="people, profile, coach, representative, rep, performance, ranking, coaching, qa, checklist, timeline">
  <meta name="coachtools-data" content="weeklyRetail, weeklyReferral, monthlyRetail, monthlyReferral, qa, documentedCoaching, checklist">
  <meta name="coachtools-favorite" content="true">
  <meta name="coachtools-order" content="25">
  <meta name="coachtools-version" content="1.0">
  <script src="../shared/coachtools-sync.js"></script>
  <script src="../shared/coachtools-storage.js"></script>
  <script src="../shared/coachtools-app-data.js"></script>
  <script src="../shared/coachtools-identity.js"></script>
  <script src="../shared/coachtools-profile-data.js"></script>
  <script src="../shared/coachtools-shell.js"></script>
  <style>
    :root{--bg:#f3f6f9;--panel:#fff;--ink:#14212d;--muted:#667786;--line:#dde5ec;--navy:#10283d;--blue:#247bb5;--cyan:#50b6d9;--green:#13805b;--amber:#a96500;--red:#b63b38;--soft:#eef5f8;--shadow:0 15px 45px rgba(31,55,74,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(15px)}.brand{display:flex;align-items:center;gap:10px;min-width:190px}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),#285b7d);color:#dff7ff;font-weight:900}.brand b,.brand small{display:block}.brand small{color:var(--muted);font-size:11px}.finder{position:relative;flex:1;max-width:720px}.finder input{width:100%;padding:11px 42px 11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.finder input:focus{border-color:#79b9dc;box-shadow:0 0 0 3px rgba(36,123,181,.1)}.finder span{position:absolute;right:14px;top:9px;color:var(--muted);font-size:18px}.status{margin-left:auto;color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}.sidebar{border-right:1px solid var(--line);background:#fff;padding:14px;overflow:auto}.sideTitle{margin:2px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:850}.peopleList{display:grid;gap:5px}.personButton{width:100%;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;padding:9px 10px;cursor:pointer}.personButton:hover,.personButton.active{border-color:var(--line);background:var(--soft)}.personButton b,.personButton small{display:block}.personButton small{margin-top:2px;color:var(--muted);font-size:11px}.content{min-width:0;overflow:auto;padding:18px}.empty{max-width:680px;margin:12vh auto;text-align:center;color:var(--muted)}.emptyIcon{width:68px;height:68px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;background:#e5f0f6;color:var(--blue);font-size:26px}.empty h1{color:var(--ink);font-size:24px}.profile{max-width:1240px;margin:0 auto}.profileHeader{position:sticky;top:0;z-index:10;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);overflow:hidden}.profileIdentity{display:flex;align-items:flex-start;gap:14px;padding:17px}.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),#34789e);color:#fff;font-size:18px;font-weight:900}.identityCopy{min-width:0}.identityCopy h1{margin:0;font-size:23px;letter-spacing:-.025em}.identityCopy p{margin:4px 0 0;color:var(--muted);font-size:12px}.headerActions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:730}.btn:hover{background:var(--soft)}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.dataBadges{display:flex;gap:6px;flex-wrap:wrap;padding:0 17px 13px}.badge{font-size:10px;font-weight:780;padding:5px 7px;border-radius:999px;background:#f1f3f5;color:#7a8792}.badge.ready{background:#e9f6f0;color:#147050}.tabs{display:flex;gap:3px;padding:0 12px;border-top:1px solid var(--line);overflow:auto}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:11px 10px 9px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:800}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.tabPanel{padding:16px 0}.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:3px 0 10px}.sectionTitle h2{margin:0;font-size:15px}.sectionTitle span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:11px}.card{grid-column:span 4;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 8px 25px rgba(31,55,74,.055);padding:13px}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card.half{grid-column:span 6}.card h3{margin:0 0 9px;font-size:12px}.kpi{font-size:25px;font-weight:900;letter-spacing:-.03em}.sub{margin-top:3px;color:var(--muted);font-size:11px}.metricGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfdff}.metric strong,.metric small{display:block}.metric strong{font-size:20px}.metric small{margin-top:3px;color:var(--muted)}.score{color:var(--blue)}.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}.rankCopy{min-width:0;flex:1}.rankCopy b,.rankCopy small{display:block}.rankCopy small{color:var(--muted);margin-top:2px}.rankValue{text-align:right}.rankValue strong,.rankValue small{display:block}.rankValue strong{font-size:17px}.rankValue small{color:var(--muted)}.attention{display:grid;grid-template-columns:1fr 1fr;gap:10px}.attentionBox{border-radius:12px;padding:11px;background:#edf8f3}.attentionBox.watch{background:#fff5e7}.attentionBox h3{color:var(--green)}.attentionBox.watch h3{color:var(--amber)}.attentionBox ul{margin:0;padding-left:17px;font-size:12px;line-height:1.55}.list{display:grid}.listRow{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.listRow:last-child{border-bottom:0}.listRow small{display:block;color:var(--muted);margin-top:2px}.pill{display:inline-block;border-radius:999px;padding:4px 7px;background:var(--soft);font-size:10px;color:#466276}.bar{height:6px;border-radius:999px;background:#e7edf2;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--cyan))}.provenance{margin-top:7px;color:var(--muted);font-size:10px}.emptyData{padding:20px;text-align:center;color:var(--muted);font-size:12px}.loading{padding:20vh 0;text-align:center;color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(8,minmax(82px,1fr));gap:7px;overflow:auto}.week{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.week b,.week small{display:block}.week small{margin-top:4px;color:var(--muted)}details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:7px}summary{cursor:pointer;padding:10px 11px;font-size:12px;font-weight:760}details .detail{padding:0 11px 11px;color:var(--muted);font-size:11px}.error{max-width:700px;margin:12vh auto;padding:18px;border:1px solid #efc6c4;border-radius:14px;background:#fff3f2;color:var(--red)}
    @media(max-width:1000px){.layout{grid-template-columns:230px minmax(0,1fr)}.card,.card.wide{grid-column:span 6}.card.full{grid-column:1/-1}}@media(max-width:720px){.topbar{flex-wrap:wrap}.brand{min-width:0}.status{display:none}.finder{order:3;flex-basis:100%;max-width:none}.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:235px}.content{padding:10px}.profileHeader{position:relative}.profileIdentity{flex-wrap:wrap}.headerActions{width:100%;margin-left:66px}.card,.card.wide,.card.half{grid-column:1/-1}.attention{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(8,110px)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="mark">PP</div><div><b>People Profiles</b><small>One person · connected CoachTools data</small></div></div>
      <label class="finder"><input id="personSearch" type="search" autocomplete="off" placeholder="Search name, alias, team, coach, or department"><span>⌕</span></label>
      <div class="status" id="registryStatus">Loading people…</div>
    </header>
    <div class="layout">
      <aside class="sidebar"><div class="sideTitle" id="listTitle">People</div><div class="peopleList" id="peopleList"></div></aside>
      <main class="content" id="content"><section class="empty"><div class="emptyIcon">◎</div><h1>Show me a person</h1><p>Search for a coach or representative to connect performance, QA, coaching, checklist activity, and department-relative comparisons.</p></section></main>
    </div>
  </div>
  <script>
  (()=>{
    'use strict';
    const RECENT_KEY='coachtools.peopleProfiles.recent.v1';
    const $=id=>document.getElementById(id);
    const state={people:[],selectedId:'',profile:null,tab:'Overview',recent:[],searchTimer:null};
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const initials=name=>String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join('').toUpperCase()||'P';
    const fmtPct=value=>Number.isFinite(value)?(value*100).toFixed(1)+'%':'—';
    const fmtDays=value=>Number.isFinite(value)?value.toFixed(1)+' days':'—';
    const fmtDate=value=>value?new Date(value).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'—';
    const sourceNames={weeklyRetail:'Weekly',weeklyReferral:'Weekly',monthlyRetail:'Monthly',monthlyReferral:'Monthly',qa:'QA',documentedCoaching:'Coaching',checklist:'Checklist'};
    function readRecent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]').filter(Boolean).slice(0,8)}catch{return[]}}
    function saveRecent(id){state.recent=[id,...state.recent.filter(value=>value!==id)].slice(0,8);try{localStorage.setItem(RECENT_KEY,JSON.stringify(state.recent))}catch{}}
    function personMeta(person){const coach=person.currentCoachId&&state.people.find(candidate=>candidate.personId===person.currentCoachId);return[person.role==='coach'?'Coach':person.role==='representative'?'Representative':'Role not set',person.department,person.currentTeam||person.team,coach&&coach.displayName].filter(Boolean).join(' · ')}
    function renderPeople(list,title){$('listTitle').textContent=title;$('peopleList').innerHTML=list.length?list.map(person=>`<button class="personButton ${person.personId===state.selectedId?'active':''}" data-person-id="${esc(person.personId)}"><b>${esc(person.displayName)}</b><small>${esc(personMeta(person))}</small></button>`).join(''):'<div class="emptyData">No matching people.</div>'}
    async function searchPeople(){const query=$('personSearch').value.trim();if(query){const matches=await CoachToolsIdentity.find(query);renderPeople(matches.slice(0,80),`${matches.length} result${matches.length===1?'':'s'}`)}else{const recent=state.recent.map(id=>state.people.find(person=>person.personId===id)).filter(Boolean);renderPeople(recent.length?recent:state.people.slice(0,40),recent.length?'Recent people':'People')}}
    function dataBadges(profile){const groups={Weekly:profile.sources.weeklyRetail||profile.sources.weeklyReferral,QA:profile.sources.qa,Coaching:profile.sources.documentedCoaching,Checklist:profile.sources.checklist,Timeline:profile.sources.checklist||profile.sources.documentedCoaching};return Object.entries(groups).map(([name,ready])=>`<span class="badge ${ready?'ready':''}">${name} ${ready?'✓':'—'}</span>`).join('')}
    function profileSubtitle(profile){const person=profile.person,coach=profile.relationships.coach;return[person.role==='coach'?'Coach':person.role==='representative'?'Representative':'Role not set',person.department&&`${person.department} Department`,person.currentTeam||person.team?`Team: ${person.currentTeam||person.team}`:'',coach?`Coach: ${coach.displayName}`:'',profile.currentDataThrough?`Data through: ${profile.currentDataThrough}`:''].filter(Boolean).join(' · ')}
    function tabsFor(profile){return profile.mode==='coach'?['Overview','Performance','Quality','Coaching','Checklist','Timeline']:['Overview','Performance','Quality','Coaching','Checklist']}
    function renderProfileShell(){const profile=state.profile,person=profile.person,tabs=tabsFor(profile);$('content').innerHTML=`<article class="profile"><header class="profileHeader"><div class="profileIdentity"><div class="avatar">${esc(initials(person.displayName))}</div><div class="identityCopy"><h1>${esc(person.displayName)}</h1><p>${esc(profileSubtitle(profile))}</p></div><div class="headerActions"><button class="btn primary" data-action="set-scope">Set as CoachTools Scope</button></div></div><div class="dataBadges">${dataBadges(profile)}</div><nav class="tabs">${tabs.map(tab=>`<button class="tab ${tab===state.tab?'active':''}" data-tab="${tab}">${tab}</button>`).join('')}</nav></header><section class="tabPanel" id="tabPanel"></section></article>`;renderTab()}
    function attentionCard(attention){const strongest=attention.strongest||[],watch=attention.watch||[];return `<div class="card full"><h3>What should I look at?</h3><div class="attention"><div class="attentionBox"><h3>Strongest areas</h3>${strongest.length?`<ul>${strongest.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<div class="sub">Not enough comparison data yet.</div>'}</div><div class="attentionBox watch"><h3>Watch areas</h3>${watch.length?`<ul>${watch.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<div class="sub">No data-backed watch area is currently available.</div>'}</div></div><div class="provenance">${esc(attention.recent||'')}</div></div>`}
    function coachOverview(profile){const s=profile.snapshot;return `<div class="sectionTitle"><h2>Executive snapshot</h2><span>Last 30 days where dates are available</span></div><div class="grid"><div class="card"><h3>Representatives</h3><div class="kpi">${s.representatives}</div><div class="sub">Current canonical coach relationships</div></div><div class="card"><h3>Documented coaching</h3><div class="kpi">${s.coachingCount}</div><div class="sub">${Number.isFinite(s.coachingPerRepresentative)?s.coachingPerRepresentative.toFixed(1)+' per representative':'Last 30 days'} · ${esc(s.activityTrend)} trend</div></div><div class="card"><h3>Checklist activity</h3><div class="kpi">${s.checklistCount}</div><div class="sub">${s.checklistCompleted} completed · ${s.checklistOpen} open</div></div><div class="card"><h3>Average response</h3><div class="kpi">${fmtDays(s.averageResponseDays)}</div><div class="sub">Median ${fmtDays(s.medianResponseDays)} · Coach Timeline calendar-day method</div></div><div class="card"><h3>QA performance</h3><div class="kpi">${fmtPct(s.qaAverage)}</div><div class="sub">Current QA records · last 30 days</div></div><div class="card"><h3>Within target</h3><div class="kpi">${fmtPct(s.withinTarget)}</div><div class="sub">Completed within ${CoachToolsProfiles.TARGET_CHECKLIST_DAYS} calendar days</div></div><div class="card wide"><h3>Department rankings</h3>${rankingRows(profile.rankings)}</div><div class="card"><h3>Recent coaching focus</h3>${topicRows(profile.coaching.topics.slice(0,5))}</div>${attentionCard(profile.attention)}</div>`}
    function representativeOverview(profile){return `<div class="sectionTitle"><h2>Performance profile</h2><span>Scores compare same-department representatives</span></div><div class="grid"><div class="card wide"><div class="metricGrid">${profile.categories.length?profile.categories.map(category=>`<div class="metric"><small>${esc(category.name)}</small><strong class="score">${Number.isFinite(category.score)?category.score.toFixed(1)+' / 10':'—'}</strong><small>${category.metrics.length?category.metrics.length+' supported metric'+(category.metrics.length===1?'':'s'):'Insufficient comparison data'}</small></div>`).join(''):'<div class="emptyData">No department-relative score can be calculated from current data.</div>'}</div></div><div class="card"><h3>Recent coaching</h3><div class="kpi">${profile.coaching.last30}</div><div class="sub">Last 30 days · ${profile.coaching.last90} in 90 days</div></div><div class="card"><h3>QA average</h3><div class="kpi">${fmtPct(profile.qa.average)}</div><div class="sub">${profile.qa.evaluations} evaluation${profile.qa.evaluations===1?'':'s'}</div></div>${attentionCard(profile.attention)}</div>`}
    function rankingRows(rankings){return rankings.map(item=>`<div class="rank"><div class="rankCopy"><b>${esc(item.name)}</b><small>${esc(item.source)} · same ${esc(state.profile.person.department||'department')}</small></div><div class="rankValue"><strong>${item.rank?`#${item.rank} / ${item.total}`:'—'}</strong><small>${item.rank?`Top ${item.percentile}% · ${esc(item.displayValue)}`:esc(item.reason)}</small></div></div>`).join('')}
    function topicRows(topics){return topics.length?topics.map(topic=>`<div class="listRow"><div>${esc(topic.name)}<small>${topic.representatives??0} rep${topic.representatives===1?'':'s'} · ${topic.repeatRepresentatives??0} repeated · ${esc(topic.trend||'stable')}</small></div><b>${topic.count}</b></div>`).join(''):'<div class="emptyData">No documented coaching topics in this period.</div>'}
    function performanceTab(profile){if(profile.mode==='coach')return `<div class="sectionTitle"><h2>Coach rankings</h2><span>Same-department coaches · last 30 days</span></div><div class="grid"><div class="card full">${rankingRows(profile.rankings)}</div></div>`;return `<div class="sectionTitle"><h2>Department comparison</h2><span>Percentile mid-rank → transparent 1–10 score</span></div><div class="grid">${profile.metricDetails.length?profile.metricDetails.map(metric=>`<div class="card half"><div class="rank"><div class="rankCopy"><b>${esc(metric.name)}</b><small>${esc(metric.category)}</small></div><div class="rankValue"><strong class="score">${metric.score?metric.score.toFixed(1)+' / 10':'—'}</strong><small>${metric.percentile!=null?metric.percentile+'th percentile':esc(metric.reason)}</small></div></div><div class="metricGrid"><div class="metric"><small>${esc(profile.person.displayName)}</small><strong>${esc(metric.displayValue)}</strong></div><div class="metric"><small>${esc(profile.person.department)} Department</small><strong>${esc(metric.departmentAverageDisplay)}</strong></div></div>${metric.score?`<div class="bar"><span style="width:${metric.score*10}%"></span></div>`:''}<div class="provenance">Source: ${esc(metric.provenance.source)}${metric.provenance.period?' · Period: '+esc(metric.provenance.period):''} · Cohort: ${metric.sampleSize} · Trend: ${esc(metric.trend.status)}${metric.trend.reason?' ('+esc(metric.trend.reason)+')':''}</div></div>`).join(''):'<div class="card full emptyData">Insufficient same-department comparison data. Scores appear only when at least ${CoachToolsProfiles.MIN_REP_COHORT} representatives have the same metric.</div>'}</div>`}
    function qualityTab(profile){const qa=profile.qa;return `<div class="sectionTitle"><h2>Quality</h2><span>QA source records</span></div><div class="grid"><div class="card"><h3>Average QA</h3><div class="kpi">${fmtPct(qa.average)}</div><div class="sub">${qa.evaluations} evaluation${qa.evaluations===1?'':'s'}</div></div><div class="card wide"><h3>Recent evaluations</h3>${qa.rows.length?qa.rows.slice(0,20).map(row=>`<div class="listRow"><div><b>${fmtDate(row.date)}</b><small>${esc(row.evaluator||'Evaluator not listed')}</small></div><b>${fmtPct(row.score)}</b></div>`).join(''):'<div class="emptyData">No matching QA records.</div>'}</div></div>`}
    function coachingTab(profile){const events=profile.coaching.events||[];return `<div class="sectionTitle"><h2>Documented coaching</h2><span>Topics are descriptive; no causal result is inferred</span></div><div class="grid">${profile.mode==='coach'?`<div class="card"><h3>Topic frequency · 30 days</h3>${topicRows(profile.coaching.topics)}</div>`:''}<div class="card ${profile.mode==='coach'?'wide':'full'}"><h3>Recent coaching history</h3>${events.length?events.slice(0,40).map(event=>`<details><summary>${fmtDate(event.date)} · ${esc(event.topics.join(', '))}</summary><div class="detail">${event.representative?`Representative: ${esc(event.representative)} · `:''}Coach: ${esc(event.coach)}${event.description?`<br>${esc(event.description)}`:''}<div class="provenance">Source: ${esc(event.provenance.source)}${event.provenance.period?' · '+esc(event.provenance.period):''}</div></div></details>`).join(''):'<div class="emptyData">No documented coaching history for this person.</div>'}</div></div>`}
    function checklistTab(profile){const data=profile.checklist,items=data.items||[];return `<div class="sectionTitle"><h2>Checklist</h2><span>Compact history with expandable detail</span></div><div class="grid"><div class="card"><h3>Total items</h3><div class="kpi">${data.total??items.length}</div><div class="sub">${data.completed??items.filter(item=>item.served).length} completed · ${data.open??items.filter(item=>!item.served).length} open</div></div>${profile.mode==='coach'?`<div class="card"><h3>Fastest categories</h3>${speedRows(data.fastestCategories)}</div><div class="card"><h3>Slowest categories</h3>${speedRows(data.slowestCategories)}</div><div class="card half"><h3>Repeated themes</h3>${frequencyRows(data.themes)}</div><div class="card half"><h3>Most checklist work</h3>${frequencyRows(data.representatives)}</div>`:`<div class="card wide"><h3>Repeated themes</h3>${frequencyRows(data.themes)}</div>`}<div class="card full"><h3>Recent items</h3>${items.length?items.slice(0,40).map(item=>`<details><summary>${fmtDate(item.created)} · ${esc(item.incident)} · ${item.served?'Completed':'Open'}</summary><div class="detail">${item.representative?`Representative: ${esc(item.representative)} · `:''}Coach: ${esc(item.coach)} · ${Number.isFinite(item.days)?fmtDays(item.days):'Open'}${item.description?`<br>${esc(item.description)}`:''}<div class="provenance">Source: ${esc(item.provenance.source)}${item.provenance.period?' · '+esc(item.provenance.period):''}</div></div></details>`).join(''):'<div class="emptyData">No checklist history for this person.</div>'}</div></div>`}
    function speedRows(rows){return rows?.length?rows.map(row=>`<div class="listRow"><div>${esc(row.name)}<small>${row.count} item${row.count===1?'':'s'}</small></div><b>${fmtDays(row.averageDays)}</b></div>`).join(''):'<div class="emptyData">Not enough completed items.</div>'}
    function frequencyRows(rows){return rows?.length?rows.map(row=>`<div class="listRow"><div>${esc(row.name)}<small>${row.open} open</small></div><b>${row.count}</b></div>`).join(''):'<div class="emptyData">No repeated themes in this period.</div>'}
    function timelineTab(profile){return `<div class="sectionTitle"><h2>Last 8 weeks</h2><span>Documented coaching and checklist completion cadence</span></div><div class="card full"><div class="timeline">${profile.timeline.map(week=>`<div class="week"><b>${esc(week.week)}</b><small>Coaching: ${week.coaching}</small><small>Checklist: ${week.checklistTotal}</small><small>Response: ${fmtPct(week.checklistResponse)}</small></div>`).join('')}</div></div>`}
    function renderTab(){const panel=$('tabPanel'),profile=state.profile;if(!panel||!profile)return;if(state.tab==='Overview')panel.innerHTML=profile.mode==='coach'?coachOverview(profile):representativeOverview(profile);if(state.tab==='Performance')panel.innerHTML=performanceTab(profile);if(state.tab==='Quality')panel.innerHTML=qualityTab(profile);if(state.tab==='Coaching')panel.innerHTML=coachingTab(profile);if(state.tab==='Checklist')panel.innerHTML=checklistTab(profile);if(state.tab==='Timeline')panel.innerHTML=timelineTab(profile)}
    async function openPerson(personId){if(!personId)return;state.selectedId=personId;saveRecent(personId);searchPeople();$('content').innerHTML='<div class="loading">Connecting current CoachTools data…</div>';try{state.profile=await CoachToolsProfiles.loadProfile(personId);if(!tabsFor(state.profile).includes(state.tab))state.tab='Overview';renderProfileShell()}catch(err){$('content').innerHTML=`<div class="error"><b>Profile could not be loaded.</b><p>${esc(err?.message||err)}</p></div>`}}
    async function setScope(){const person=state.profile?.person;if(!person)return;CoachToolsStorage.setScope({mode:person.role==='representative'?'representative':'coach',personId:person.personId,label:person.displayName,department:person.department||'',team:person.currentTeam||person.team||'',coaches:person.role==='coach'?[person.displayName]:[],representatives:person.role==='representative'?[person.displayName]:[]});$('registryStatus').textContent=`Scope set to ${person.displayName}`}
    async function initialize(){state.recent=readRecent();await Promise.all([CoachToolsIdentity.ready(),CoachToolsAppData.ready()]);state.people=await CoachToolsIdentity.getAllPeople();$('registryStatus').textContent=`${state.people.length.toLocaleString()} canonical people`;await searchPeople();const scope=CoachToolsAppData.getScope();if(scope?.personId&&state.people.some(person=>person.personId===scope.personId))await openPerson(scope.personId)}
    $('personSearch').addEventListener('input',()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(searchPeople,100)});$('peopleList').addEventListener('click',event=>{const button=event.target.closest('[data-person-id]');if(button)openPerson(button.dataset.personId)});$('content').addEventListener('click',event=>{const tab=event.target.closest('[data-tab]')?.dataset.tab,action=event.target.closest('[data-action]')?.dataset.action;if(tab){state.tab=tab;renderProfileShell()}if(action==='set-scope')setScope()});CoachToolsAppData.subscribe(['weeklyRetail','weeklyReferral','monthlyRetail','monthlyReferral','qa','documentedCoaching','checklist'],()=>{if(state.selectedId)openPerson(state.selectedId)});CoachToolsAppData.subscribeScope(scope=>{if(scope.personId&&scope.personId!==state.selectedId)openPerson(scope.personId)});CoachToolsIdentity.subscribe(async()=>{state.people=await CoachToolsIdentity.getAllPeople();await searchPeople()});initialize().catch(err=>{$('content').innerHTML=`<div class="error"><b>People Profiles could not start.</b><p>${esc(err?.message||err)}</p></div>`});
  })();
  </script>
</body>
</html>

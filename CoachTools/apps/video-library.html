<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Training Videos</title>
  <meta name="coachtools-app" content="true" />
  <meta name="coachtools-id" content="video-library" />
  <meta name="coachtools-name" content="Training Videos" />
  <meta name="coachtools-description" content="Browse and watch CoachTools training videos from the Videos folder." />
  <meta name="coachtools-icon" content="icons/default-app.png" />
  <meta name="coachtools-initials" content="TV" />
  <meta name="coachtools-category" content="Training" />
  <meta name="coachtools-keywords" content="video,training,coaching,mp4,library" />
  <meta name="coachtools-favorite" content="false" />
  <meta name="coachtools-featured" content="false" />
  <meta name="coachtools-preload" content="false" />
  <meta name="coachtools-order" content="90" />
  <meta name="coachtools-version" content="1.0" />
  <meta name="coachtools-enabled" content="true" />
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(8, 12, 27, 0.76);
      --panel-strong: rgba(9, 14, 31, 0.92);
      --border: rgba(167, 196, 255, 0.18);
      --border-bright: rgba(131, 188, 255, 0.42);
      --text: #f4f7ff;
      --muted: #9ea9c6;
      --accent: #83bcff;
      --accent-soft: rgba(131, 188, 255, 0.14);
      --danger: #ff9fa8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050811;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      background-image:
        linear-gradient(rgba(2, 5, 14, 0.30), rgba(2, 5, 14, 0.72)),
        url('../graphics/videobackground.png'),
        radial-gradient(circle at 18% 18%, rgba(66, 100, 180, 0.18), transparent 35%),
        radial-gradient(circle at 82% 72%, rgba(116, 76, 181, 0.16), transparent 38%),
        linear-gradient(145deg, #040712, #0b1023 52%, #070915);
      background-size: cover, cover, cover, cover, cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        radial-gradient(circle at 11% 19%, #fff 0 1px, transparent 1.2px),
        radial-gradient(circle at 29% 71%, #b7d6ff 0 1px, transparent 1.2px),
        radial-gradient(circle at 57% 22%, #fff 0 1px, transparent 1.2px),
        radial-gradient(circle at 73% 49%, #c8b7ff 0 1px, transparent 1.2px),
        radial-gradient(circle at 91% 14%, #fff 0 1px, transparent 1.2px),
        radial-gradient(circle at 82% 84%, #b7d6ff 0 1px, transparent 1.2px);
      background-size: 190px 190px, 250px 250px, 220px 220px, 300px 300px, 270px 270px, 230px 230px;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
      gap: 18px;
      width: 100%;
      height: 100vh;
      padding: 20px;
    }

    .sidebar,
    .player-shell {
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      min-height: 0;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.035), transparent);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .subhead {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .search-wrap { padding: 14px 14px 10px; }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(6, 9, 20, 0.64);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      outline: none;
      font: inherit;
    }

    .search:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 0 3px rgba(131,188,255,0.08);
    }

    .video-list {
      min-height: 0;
      overflow: auto;
      padding: 4px 10px 14px;
      scrollbar-width: thin;
    }

    .video-item {
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      text-align: left;
      border-radius: 13px;
      padding: 10px;
      cursor: pointer;
      transition: 150ms ease;
      margin-bottom: 4px;
    }

    .video-item:hover {
      background: rgba(255,255,255,0.045);
      border-color: rgba(255,255,255,0.055);
      transform: translateX(2px);
    }

    .video-item.active {
      background: var(--accent-soft);
      border-color: var(--border-bright);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .play-dot {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(131,188,255,0.12);
      border: 1px solid rgba(131,188,255,0.18);
      color: #dbeaff;
      font-size: 13px;
    }

    .video-name {
      min-width: 0;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-file {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-list {
      margin: 14px 4px;
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    .player-shell {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.035), transparent);
    }

    .now-playing-label {
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .now-playing-title {
      margin: 0;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .count {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(4,7,16,0.45);
      font-size: 11px;
      font-weight: 700;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .video-frame {
      position: relative;
      width: min(100%, 1500px);
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 142px);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(177,203,255,0.22);
      background: rgba(0,0,0,0.72);
      box-shadow: 0 26px 80px rgba(0,0,0,0.52), 0 0 0 1px rgba(255,255,255,0.025) inset;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(50,79,145,.18), rgba(1,3,9,.88));
    }

    .placeholder.hidden { display: none; }

    .placeholder-inner { max-width: 560px; }
    .placeholder-icon { font-size: 38px; margin-bottom: 12px; opacity: .9; }
    .placeholder h2 { margin: 0 0 8px; font-size: 21px; }
    .placeholder p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 13px; }

    .error {
      margin-top: 12px;
      color: var(--danger);
      font-size: 12px;
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }
      .sidebar { max-height: 40vh; }
      .player-shell { min-height: 56vh; }
      .video-frame { max-height: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <p class="eyebrow">CoachTools Learning</p>
        <h1>Training Videos</h1>
        <p class="subhead">Choose a video on the left to watch it here.</p>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" type="search" placeholder="Search videos…" autocomplete="off" />
      </div>
      <div id="videoList" class="video-list" aria-label="Training video list"></div>
    </aside>

    <section class="player-shell">
      <header class="player-header">
        <div>
          <div class="now-playing-label">Now Playing</div>
          <h2 id="nowPlaying" class="now-playing-title">Select a video</h2>
        </div>
        <div id="videoCount" class="count">0 videos</div>
      </header>

      <div class="stage">
        <div class="video-frame">
          <video id="player" controls playsinline preload="metadata"></video>
          <div id="placeholder" class="placeholder">
            <div class="placeholder-inner">
              <div class="placeholder-icon">▶</div>
              <h2 id="placeholderTitle">Your video library is ready.</h2>
              <p id="placeholderText">Add MP4 filenames to the VIDEO_FILES list inside this HTML file, then place those MP4 files in the CoachTools/Videos folder.</p>
              <div id="errorText" class="error" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    /*
      STATIC / OFFLINE VIDEO LIST
      ---------------------------
      Coaches do NOT need Node or a local server.

      Add the exact MP4 filenames below. The matching files must live in:
        CoachTools/Videos/

      Example:
        const VIDEO_FILES = [
          'Welcome to CoachTools.mp4',
          'How to Use the All-Star Report.mp4',
          'Coaching Workflow.mp4'
        ];
    */
    const VIDEO_FILES = [
      // Add exact MP4 filenames here.
    ];

    const player = document.getElementById('player');
    const videoList = document.getElementById('videoList');
    const search = document.getElementById('search');
    const nowPlaying = document.getElementById('nowPlaying');
    const videoCount = document.getElementById('videoCount');
    const placeholder = document.getElementById('placeholder');
    const placeholderTitle = document.getElementById('placeholderTitle');
    const placeholderText = document.getElementById('placeholderText');
    const errorText = document.getElementById('errorText');

    const videos = VIDEO_FILES
      .filter(file => typeof file === 'string' && /\.mp4$/i.test(file.trim()))
      .map(file => ({
        file: file.trim(),
        title: file.trim().replace(/\.mp4$/i, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim()
      }));

    let activeFile = '';

    function videoUrl(file) {
      return '../Videos/' + encodeURIComponent(file);
    }

    function updateCount(count) {
      videoCount.textContent = `${count} video${count === 1 ? '' : 's'}`;
    }

    function selectVideo(video, autoPlay = true) {
      if (!video) return;
      activeFile = video.file;
      errorText.hidden = true;
      errorText.textContent = '';
      nowPlaying.textContent = video.title;
      player.src = videoUrl(video.file);
      player.load();
      placeholder.classList.add('hidden');
      renderList(search.value);
      if (autoPlay) {
        const playAttempt = player.play();
        if (playAttempt && typeof playAttempt.catch === 'function') playAttempt.catch(() => {});
      }
    }

    function renderList(query = '') {
      const normalized = query.trim().toLowerCase();
      const filtered = videos.filter(video =>
        !normalized || video.title.toLowerCase().includes(normalized) || video.file.toLowerCase().includes(normalized)
      );

      videoList.innerHTML = '';
      updateCount(filtered.length);

      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-list';
        empty.textContent = videos.length
          ? 'No videos match your search.'
          : 'No videos are configured yet. Add exact MP4 filenames to VIDEO_FILES in video-library.html.';
        videoList.appendChild(empty);
        return;
      }

      filtered.forEach(video => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'video-item' + (video.file === activeFile ? ' active' : '');
        button.title = video.title;
        button.innerHTML = `
          <span class="play-dot">▶</span>
          <span>
            <span class="video-name">${escapeHtml(video.title)}</span>
            <span class="video-file">${escapeHtml(video.file)}</span>
          </span>`;
        button.addEventListener('click', () => selectVideo(video));
        videoList.appendChild(button);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    search.addEventListener('input', event => renderList(event.target.value));

    player.addEventListener('error', () => {
      placeholder.classList.remove('hidden');
      placeholderTitle.textContent = 'Video file not found.';
      placeholderText.textContent = 'Make sure the MP4 filename exactly matches the hard-coded entry and that the file is inside CoachTools/Videos.';
      errorText.textContent = activeFile ? `Missing or unreadable: ${activeFile}` : '';
      errorText.hidden = !activeFile;
    });

    player.addEventListener('loadedmetadata', () => {
      placeholder.classList.add('hidden');
      errorText.hidden = true;
    });

    renderList();

    if (videos.length) {
      selectVideo(videos[0], false);
    }
  </script>
</body>
</html>
